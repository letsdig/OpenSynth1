name: Build OpenSynth1 (Linux x86_64)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Linux x86_64 (Debian 12 / Ubuntu 22.04+ Compatible)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libx11-dev \
            libxinerama-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libglib2.0-dev \
            pkg-config

      - name: Checkout JUCE Framework next to the repo
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git ../JUCE

      - name: Build Standalone and VST3
        run: |
          make -C Builds/LinuxMakefile \
            CONFIG=Release \
            -j$(nproc)

      - name: Package Release Binaries
        run: |
          mkdir -p dist
          cp Builds/LinuxMakefile/build/OpenSynth1 dist/
          cp -r Builds/LinuxMakefile/build/OpenSynth1.vst3 dist/
          strip --strip-unneeded dist/OpenSynth1
          strip --strip-unneeded dist/OpenSynth1.vst3/Contents/x86_64-linux/OpenSynth1.so
          cd dist
          tar -czvf OpenSynth1-Linux-x86_64-standalone.tar.gz OpenSynth1
          tar -czvf OpenSynth1-Linux-x86_64-vst3.tar.gz OpenSynth1.vst3

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSynth1-Linux-x86_64-binaries
          path: |
            dist/*.tar.gz

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenSynth1-Linux-x86_64-standalone.tar.gz
            dist/OpenSynth1-Linux-x86_64-vst3.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
